# parameters_harmoni_mcmc_two_instruments.yml
# =============================================================================
# Joint Keplerian orbit inference from two independent HARMONI datasets.
# Each dataset has its own epochs, noise estimate and S/N likelihood.
# Both datasets share the same orbital parameters and reference epoch.
#
# Directory layout (relative to this YAML file):
#   images_HARMONI_1st_half/image_0.fits
#   images_HARMONI_1st_half/image_1.fits
#   images_HARMONI_2nd_half/image_0.fits
#   images_HARMONI_2nd_half/image_1.fits
#
# IMPORTANT: Check times_years against the actual observation epochs.
# =============================================================================

dist: 86.2                  # Stellar distance in parsecs.
weighting: "invvar"        # "invvar" or "simple".
t_ref_mode: "min_ts"       # Shared orbital reference epoch: earliest observation.

# ----------------------------------------------------------------------------
# Instruments: independent noise floors and likelihood contributions
# ----------------------------------------------------------------------------
instruments:
  - name: "HARMONI_1st_half"
    method: "convolve"
    likelihood_mode: "signed_snr"
    images_dir: "images_HARMONI_1st_half"
    times_years: [0.0, 1.5]

    resol: 4.0              # Plate scale [mas/native pixel].
    fwhm: 2.0               # PSF FWHM [native pixels].
    r_mask: 23.0            # Inner working angle [native pixels].
    r_mask_ext: 74.0        # Outer working angle [native pixels].

    noise_floor:
      mode: "auto"          # Computed from this instrument's noise data only.
      fraction_of_median: 1.0e-3
      min_samples: 100

    # To use the Gaussian flux likelihood instead:
    # likelihood_mode: "flux"  # Replace signed_snr above, do not duplicate it.
    # flux:
    #   sample: true
    #   bounds: [1.0e-4, 1.0e2]  # Adapt to THIS instrument's flux units.
    #   prior: "uniform"
    #   init: 1.0
    #   spread: 0.2

  - name: "HARMONI_2nd_half"
    method: "convolve"
    likelihood_mode: "signed_snr"
    images_dir: "images_HARMONI_2nd_half"
    times_years: [3.0, 4.5]

    resol: 4.0
    fwhm: 2.0
    r_mask: 23.0
    r_mask_ext: 74.0

    noise_floor:
      mode: "auto"          # Independently calibrated noise floor.
      fraction_of_median: 1.0e-3
      min_samples: 100

    # When switching this instrument to likelihood_mode: "flux":
    # flux:
    #   sample: true
    #   bounds: [1.0e-4, 1.0e2]  # Adapt independently to its flux units.
    #   prior: "uniform"
    #   init: 1.0
    #   spread: 0.2

# ----------------------------------------------------------------------------
# Image preparation and local noise estimation
# ----------------------------------------------------------------------------
preprocessing:
  upsampling_factor: 5

background_noise:
  aperture_spacing_fwhm: 2.0
  exclusion_radius_fwhm: 4.0
  radial_samples: 3
  radial_step_fwhm: 2.0
  min_reference_apertures: 1
  sigma_statistic: "mad"
  small_sample_correction: "student"
  student_small_n_threshold: null
  local_map_mode: "precompute_cache"
  precompute_maps: true
  overwrite_cached_maps: false

radial_noise_recalibration:
  mode: "none"
  bin_width_px: 2.0
  max_distance_px: 30.0
  min_samples_per_bin: 30
  smoothing_bins: 3
  min_factor: 1.0
  monotonic_extent_px: 4.0
  extrapolation_fit_min_px: 1.0
  extrapolation_fit_max_px: 5.0
  cache: true
  overwrite_cache: false

# ----------------------------------------------------------------------------
# Shared orbital priors
# ----------------------------------------------------------------------------
priors:
  a_bounds: [8.0, 30.0]     # Semi-major axis [AU].
  m0_bounds: [1.55, 1.65]   # Stellar mass [solar masses].
  la0_bounds: [0.0, 6.283185307179586]
  e_max: 0.95
  orbit_direction: "any"

# ----------------------------------------------------------------------------
# Deterministic grid search to initialise orbital walkers
# ----------------------------------------------------------------------------
init_mode: "init_search"

init_search:
  stellar_mass_solar: 1.59
  top_n_save: 5000
  grid_batch_size: 50000
  physical_grid:
    a_au:       {min: 8.0, max: 30.0, step: 2.0}
    e:          {min: 0.0, max: 0.9, step: 0.1}
    i_deg:      {min: 0.0, max: 180.0, step: 10.0}
    M0_deg:     {min: 0.0, max: 350.0, step: 10.0}
    theta0_deg: {min: 0.0, max: 350.0, step: 10.0}
    omega_deg:  {min: 0.0, max: 350.0, step: 10.0}

init_spread:
  a: 0.02
  la0: 0.2
  m0: 0.02
  hk: 0.02
  pq: 0.02
  fp: 0.2

multistart:
  enabled: false
  n_starts: 5
  detrack: true
  detrack_dmax_px: 2.0

# ----------------------------------------------------------------------------
# MCMC sampler
# ----------------------------------------------------------------------------
mcmc:
  sampler: "reddemcee"
  likelihood_mode: "signed_snr"   # Fallback when absent from instruments.
  progress: true
  sample_fp: false               # No explicit flux parameters in S/N mode.

  emcee:
    walkers: 100
    burnin_steps: 25000
    production_steps: 75000
    thin: 100
    moves:
      - {name: "stretch", weight: 1.0, a: 2.0}

  # Used only if sampler is changed to "reddemcee".
  reddemcee:
    walkers: 128
    burnin_sweeps: 100
    production_sweeps: 1000
    thin: 10
    temperatures: 12
    beta_min: 1.0e-4
    betas: null
    inner_steps: 1
    adapt_mode: "SAR"
    adapt_tau: 700.0
    adapt_nu: 0.30
    stretch_a: 1.5
    smd_history: true
    tsw_history: true

parallel:
  max_workers: null
  chunk_size: null

logging:
  save_console: true

outputs:
  save_chain: true
  chain_filename: "mcmc_chain_and_logprob.h5"
