# Keplerian orbit inference — four HARMONI epochs.
# Times are years in a common reference frame; validate against the observing log.
# Pixel radii are native detector pixels; fluxes are in the images' native units.
# The orbit prior uses uniform eccentricity and inclination (not isotropic orientation).
# A narrow but NONZERO stellar-mass range is required by the 7-D sampler.
# Sampling full prior grid and 75k steps can take substantial time.
# Diagnostic images have independent symmetric colorbars; each shows only MAP.
# profiles/ holds noise-model cache products; no orbit-aligned image is generated.

dist: 86.2
weighting: simple
t_ref_mode: min_ts
instruments:
- name: HARMONI
  method: convolve
  likelihood_mode: signed_snr
  images_dir: images
  times_years:
  - 1.322381930184805
  - 2.2642026009582477
  - 2.924024640657084
  - 4.188911704312115
  resol: 12.25
  fwhm: 1.6887225152574619
  r_mask: 26.0
  r_mask_ext: 61.0
  noise_floor:
    mode: auto
    fraction_of_median: 0.001
    min_samples: 100
preprocessing:
  upsampling_factor: 5
background_noise:
  aperture_spacing_fwhm: 2.0
  exclusion_radius_fwhm: 4.0
  radial_samples: 3
  radial_step_fwhm: 2.0
  min_reference_apertures: 1
  sigma_statistic: mad
  small_sample_correction: student
  student_small_n_threshold: null
  local_map_mode: precompute_cache
  precompute_maps: true
  overwrite_cached_maps: false
radial_noise_recalibration:
  mode: monotonic_inward
  bin_width_px: 2.0
  max_distance_px: 30.0
  min_samples_per_bin: 30
  smoothing_bins: 3
  min_factor: 1.0
  monotonic_extent_px: 4.0
  extrapolation_fit_min_px: 1.0
  extrapolation_fit_max_px: 5.0
  cache: true
  overwrite_cache: false
priors:
  a_bounds:
  - 40.0
  - 62.0
  m0_bounds:
  - 1.589
  - 1.591
  la0_bounds:
  - 0.0
  - 6.283185307179586
  e_max: 0.4
  orbit_direction: any
init_mode: init_search
init_search:
  stellar_mass_solar: 1.59
  top_n_save: 5000
  grid_batch_size: 10000
  physical_grid:
    a_au:
      min: 40
      max: 62
      step: 3.0
    e:
      min: 0
      max: 0.4
      step: 0.1
    i_deg:
      min: 0
      max: 180
      step: 30
    M0_deg:
      min: 0
      max: 350
      step: 20
    theta0_deg:
      min: 0
      max: 345
      step: 30
    omega_deg:
      min: 0
      max: 345
      step: 30
init_spread:
  a: 0.02
  la0: 0.2
  m0: 0.0001
  hk: 0.02
  pq: 0.02
  fp: 0.2
multistart:
  enabled: true
  n_starts: 5
  source: init_search
  detrack: true
  detrack_dmax_px: 2.0
mcmc:
  sampler: emcee
  likelihood_mode: signed_snr
  progress: true
  sample_fp: false
  emcee:
    walkers: 100
    burnin_steps: 25000
    production_steps: 75000
    thin: 100
    moves:
    - name: stretch
      weight: 1.0
      a: 2.0
  reddemcee:
    walkers: 128
    burnin_sweeps: 5000
    production_sweeps: 20000
    thin: 20
    temperatures: 12
    beta_min: 0.0001
    betas: null
    inner_steps: 1
    adapt_mode: SAR
    adapt_tau: 700.0
    adapt_nu: 0.3
    stretch_a: 1.5
    smd_history: true
    tsw_history: true
parallel:
  max_workers: null
  chunk_size: null
logging:
  save_console: true
  color: auto
  progress_mode: auto
plots:
  enabled: true
  max_posterior_samples: 20000
  max_orbit_tracks: 1200
  dpi: 180
  mask_to_working_region: true # Color scale uses only IWA < radius < OWA.
outputs:
  save_chain: true
  chain_filename: mcmc_chain_and_logprob.h5
