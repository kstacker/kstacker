[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kstacker"
version = "1.1.0"
description = "Multi-epoch Keplerian orbit inference for direct imaging"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "astropy>=5.3", "photutils>=1.9", "PyYAML>=6", "h5py>=3.8", "emcee>=3.1", "matplotlib>=3.7", "tqdm>=4.65", "joblib>=1.3"]

[project.optional-dependencies]
tempering = ["reddemcee"]

[project.scripts]
kstacker = "kstacker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
